<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Math Builds: Pick a build</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Caveat:wght@500;700&family=Figtree:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width:1440px;height:900px;box-sizing:border-box;background:#FFFFFF;color:#22201C;font-family:'Figtree',sans-serif;display:flex;flex-direction:column;overflow:hidden">

<div style="height:72px;box-sizing:border-box;padding:0 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #E6E2DA">
<div style="display:flex;align-items:center;gap:14px">
<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path d="M4 30 H12 V36 H4Z M28 30 H36 V36 H28Z M12 28 H28 M12 24 H28 M12 24 L16 16 L20 24 L24 16 L28 24 M16 16 H28" fill="none" stroke="#22201C" stroke-width="2.2" stroke-linejoin="round"/><circle cx="8" cy="22" r="3" fill="#E0661A"/></svg>
<div style="font-family:'Fraunces',serif;font-weight:800;font-size:28px;letter-spacing:-0.3px">Math Builds</div>
</div>
<div style="display:flex;align-items:center;gap:18px">
<div style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#F2B544"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#9A6A12" stroke-width="1.5"/></svg><span>148 marks</span></div>
<button style="display:flex;align-items:center;gap:10px;min-height:46px;padding:0 16px 0 6px;border-radius:99px;border:1.5px solid #22201C;background:#fff;font-weight:600;font-size:16px"><span style="width:34px;height:34px;border-radius:50%;background:#2F8F4E;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:800">M</span>Maya</button>
</div>
</div>

<div style="padding:22px 32px 0;display:flex;justify-content:space-between;align-items:flex-end">
<div>
<div style="font-family:'Fraunces',serif;font-weight:800;font-size:44px;letter-spacing:-0.8px;line-height:1">What will you build?</div>
<div style="font-family:'Caveat',cursive;font-size:24px;color:#6B6459;margin-top:6px">Pick one. Prove the math it needs, earn marks, buy materials, build it, test it.</div>
</div>
<div style="display:flex;gap:8px;font-size:13px;color:#6B6459;align-items:center">
<span>Your strands:</span>
<span style="padding:5px 10px;border-radius:99px;background:#E8F3EA;color:#1F6B3A;font-weight:700">Measuring 7</span>
<span style="padding:5px 10px;border-radius:99px;background:#E8F3EA;color:#1F6B3A;font-weight:700">Adding 7</span>
<span style="padding:5px 10px;border-radius:99px;background:#FFF3DA;color:#9A6A12;font-weight:700">Dividing 5</span>
<span style="padding:5px 10px;border-radius:99px;background:#FFF3DA;color:#9A6A12;font-weight:700">Fractions 4</span>
<span style="padding:5px 10px;border-radius:99px;background:#F1EFEA;color:#6B6459;font-weight:700">Ratios 2</span>
</div>
</div>

<div style="flex:1;padding:18px 32px 28px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:18px;min-height:0">

<!-- bridge -->
<button style="text-align:left;border:1.5px solid #22201C;border-radius:18px;background:#fff;padding:0;overflow:hidden;display:flex;flex-direction:column;color:#22201C;box-shadow:0 4px 0 #22201C">
<svg viewBox="0 0 440 150" width="100%" height="150" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display:block;flex:none">
<defs><linearGradient id="w1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8CCBE8"/><stop offset="1" stop-color="#2E7FB0"/></linearGradient><linearGradient id="ok1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C58B4E"/><stop offset="1" stop-color="#7E4F22"/></linearGradient></defs>
<rect width="440" height="150" fill="#EAF4FB"/><path d="M0 70 Q110 40 220 70 T440 60 V150 H0Z" fill="#CFE7C4"/>
<rect x="0" y="105" width="440" height="45" fill="url(#w1)"/>
<rect x="0" y="80" width="110" height="70" fill="#A89F91"/><rect x="330" y="80" width="110" height="70" fill="#A89F91"/>
<g fill="#C4BBAC" stroke="#5E564B" stroke-width="0.8"><rect x="6" y="86" width="40" height="16" rx="2"/><rect x="52" y="86" width="52" height="16" rx="2"/><rect x="336" y="86" width="46" height="16" rx="2"/><rect x="388" y="86" width="46" height="16" rx="2"/></g>
<rect x="90" y="72" width="260" height="9" fill="url(#ok1)" stroke="#5A3A16" stroke-width="0.8"/>
<path d="M110 72 L150 36 L190 72 L230 36 L270 72 L310 36 L330 54 M150 36 H310" fill="none" stroke="#7E4F22" stroke-width="4" stroke-linejoin="round"/>
<g transform="translate(20 46)"><path d="M0 22 V12 Q0 10 2 10 H24 L30 2 H44 L48 10 H56 Q58 10 58 12 V22Z" fill="#FF8A3C" stroke="#8A3E0C"/><circle cx="12" cy="24" r="5" fill="#2A2A2E"/><circle cx="46" cy="24" r="5" fill="#2A2A2E"/></g>
</svg>
<div style="padding:12px 16px 14px;display:flex;flex-direction:column;gap:6px;flex:1">
<div style="display:flex;justify-content:space-between;align-items:baseline"><div style="font-family:'Fraunces',serif;font-weight:800;font-size:24px">The River Bridge</div><div style="font-size:12px;font-weight:700;color:#1F6B3A;background:#E8F3EA;padding:3px 9px;border-radius:99px">Level 7 of 13</div></div>
<div style="font-size:14px;color:#6B6459">Measuring, adding, dividing, fractions. Later triangles and sag.</div>
<div style="margin-top:auto;display:flex;align-items:center;gap:8px"><div style="flex:1;height:8px;border-radius:99px;background:#F1EFEA;overflow:hidden"><div style="width:54%;height:100%;background:#2F8F4E"></div></div><span style="font-family:'Caveat',cursive;font-size:18px;color:#6B6459">continue</span></div>
</div>
</button>

<!-- teeter totter -->
<button style="text-align:left;border:1.5px solid #22201C;border-radius:18px;background:#fff;padding:0;overflow:hidden;display:flex;flex-direction:column;color:#22201C;box-shadow:0 4px 0 #22201C">
<svg viewBox="0 0 440 150" width="100%" height="150" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display:block;flex:none">
<rect width="440" height="150" fill="#FFF6E8"/><path d="M0 110 Q220 80 440 110 V150 H0Z" fill="#A9D49A"/>
<circle cx="380" cy="34" r="18" fill="#FFD66B"/>
<path d="M200 118 L240 88 L240 118Z" fill="#E0661A" stroke="#8A3E0C" stroke-width="1.2"/>
<g transform="rotate(-9 220 90)"><rect x="70" y="86" width="300" height="10" rx="3" fill="#C58B4E" stroke="#5A3A16" stroke-width="1"/><rect x="78" y="62" width="36" height="24" rx="4" fill="#2E7FB0" stroke="#1F4E7A"/><rect x="330" y="68" width="24" height="18" rx="4" fill="#B3452B" stroke="#7A2A18"/></g>
<text x="96" y="56" font-family="Caveat" font-size="18" fill="#22201C" font-weight="700">4 kg</text><text x="330" y="60" font-family="Caveat" font-size="18" fill="#22201C" font-weight="700">2 kg</text>
</svg>
<div style="padding:12px 16px 14px;display:flex;flex-direction:column;gap:6px;flex:1">
<div style="display:flex;justify-content:space-between;align-items:baseline"><div style="font-family:'Fraunces',serif;font-weight:800;font-size:24px">The Teeter Totter</div><div style="font-size:12px;font-weight:700;color:#9A6A12;background:#FFF3DA;padding:3px 9px;border-radius:99px">Level 3 of 13</div></div>
<div style="font-size:14px;color:#6B6459">Comparing, multiplying, balance. Later moments and unknown masses.</div>
<div style="margin-top:auto;display:flex;align-items:center;gap:8px"><div style="flex:1;height:8px;border-radius:99px;background:#F1EFEA;overflow:hidden"><div style="width:23%;height:100%;background:#F2B544"></div></div><span style="font-family:'Caveat',cursive;font-size:18px;color:#6B6459">continue</span></div>
</div>
</button>

<!-- winch -->
<button style="text-align:left;border:1.5px solid #22201C;border-radius:18px;background:#fff;padding:0;overflow:hidden;display:flex;flex-direction:column;color:#22201C;box-shadow:0 4px 0 #22201C">
<svg viewBox="0 0 440 150" width="100%" height="150" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display:block;flex:none">
<rect width="440" height="150" fill="#F3F6F9"/>
<g transform="translate(150 70)"><circle r="40" fill="#2E5BB8" stroke="#1F3F80" stroke-width="2"/><g stroke="#1F3F80" stroke-width="7" stroke-linecap="round"><path d="M0 -44 V-50 M0 44 V50 M-44 0 H-50 M44 0 H50 M-31 -31 L-36 -36 M31 31 L36 36 M31 -31 L36 -36 M-31 31 L-36 36"/></g><circle r="8" fill="#F2B544"/></g>
<g transform="translate(222 70)"><circle r="20" fill="#1F8A8C" stroke="#115858" stroke-width="2"/><g stroke="#115858" stroke-width="5" stroke-linecap="round"><path d="M0 -23 V-27 M0 23 V27 M-23 0 H-27 M23 0 H27"/></g><circle r="5" fill="#F2B544"/></g>
<path d="M242 70 H330" stroke="#5A3A16" stroke-width="3"/><circle cx="330" cy="82" r="12" fill="#B9BDC4" stroke="#22201C"/><path d="M342 82 V118" stroke="#5A3A16" stroke-width="3"/>
<rect x="312" y="100" width="70" height="50" fill="#3A3D42"/><path d="M332 118 L336 140 H348 L352 118Z" fill="#1F8A8C" stroke="#115858"/>
<text x="150" y="130" text-anchor="middle" font-family="Caveat" font-size="18" fill="#22201C" font-weight="700">36 teeth</text><text x="222" y="104" text-anchor="middle" font-family="Caveat" font-size="16" fill="#22201C" font-weight="700">12</text>
</svg>
<div style="padding:12px 16px 14px;display:flex;flex-direction:column;gap:6px;flex:1">
<div style="display:flex;justify-content:space-between;align-items:baseline"><div style="font-family:'Fraunces',serif;font-weight:800;font-size:24px">The Well Winch</div><div style="font-size:12px;font-weight:700;color:#6B6459;background:#F1EFEA;padding:3px 9px;border-radius:99px">Not started</div></div>
<div style="font-size:14px;color:#6B6459">Counting teeth, ratios, fractions of a turn. Later torque and clockwork.</div>
<div style="margin-top:auto;display:flex;align-items:center;gap:8px"><div style="flex:1;height:8px;border-radius:99px;background:#F1EFEA"></div><span style="font-family:'Caveat',cursive;font-size:18px;color:#6B6459">start</span></div>
</div>
</button>

<!-- ramp -->
<button style="text-align:left;border:1.5px solid #22201C;border-radius:18px;background:#fff;padding:0;overflow:hidden;display:flex;flex-direction:column;color:#22201C;box-shadow:0 4px 0 #22201C">
<svg viewBox="0 0 440 150" width="100%" height="150" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display:block;flex:none">
<rect width="440" height="150" fill="#EAF4FB"/><path d="M0 120 H440 V150 H0Z" fill="#A9D49A"/>
<path d="M60 120 L300 50 H440 V120Z" fill="#C9C0B1" stroke="#5E564B" stroke-width="1.2"/><path d="M60 120 L300 50" stroke="#4A4A4F" stroke-width="6"/>
<path d="M300 50 H440" stroke="#4A4A4F" stroke-width="6"/>
<g transform="translate(150 70) rotate(-16)"><path d="M0 22 V12 Q0 10 2 10 H24 L30 2 H44 L48 10 H56 Q58 10 58 12 V22Z" fill="#B3452B" stroke="#7A2A18"/><circle cx="12" cy="24" r="5" fill="#2A2A2E"/><circle cx="46" cy="24" r="5" fill="#2A2A2E"/></g>
<path d="M300 50 V120" stroke="#B3452B" stroke-width="1.5" stroke-dasharray="4 4"/><text x="312" y="92" font-family="Caveat" font-size="18" fill="#B3452B" font-weight="700">rise 3 m</text><text x="150" y="140" font-family="Caveat" font-size="18" fill="#B3452B" font-weight="700" text-anchor="middle">run 12 m</text>
</svg>
<div style="padding:12px 16px 14px;display:flex;flex-direction:column;gap:6px;flex:1">
<div style="display:flex;justify-content:space-between;align-items:baseline"><div style="font-family:'Fraunces',serif;font-weight:800;font-size:24px">The Mountain Ramp</div><div style="font-size:12px;font-weight:700;color:#6B6459;background:#F1EFEA;padding:3px 9px;border-radius:99px">Not started</div></div>
<div style="font-size:14px;color:#6B6459">Rise over run, angles, how steep a car can climb. Later speed and energy.</div>
<div style="margin-top:auto;display:flex;align-items:center;gap:8px"><div style="flex:1;height:8px;border-radius:99px;background:#F1EFEA"></div><span style="font-family:'Caveat',cursive;font-size:18px;color:#6B6459">start</span></div>
</div>
</button>

<!-- bicycle -->
<button style="text-align:left;border:1.5px solid #D9D4CB;border-radius:18px;background:#FBFAF7;padding:0;overflow:hidden;display:flex;flex-direction:column;color:#22201C">
<svg viewBox="0 0 440 150" width="100%" height="150" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display:block;flex:none;opacity:0.85">
<rect width="440" height="150" fill="#F7F3EC"/><path d="M0 125 H440 V150 H0Z" fill="#CFE7C4"/>
<g fill="none" stroke="#22201C" stroke-width="3"><circle cx="130" cy="100" r="34"/><circle cx="310" cy="100" r="34"/><path d="M130 100 L190 48 H260 L310 100 M190 48 L220 100 M220 100 L260 48 M180 44 H200 M258 44 H272"/><circle cx="220" cy="100" r="12"/></g>
<circle cx="220" cy="100" r="6" fill="#E0661A"/><circle cx="310" cy="100" r="5" fill="#E0661A"/><path d="M220 94 L310 95 M220 106 L310 105" stroke="#6B6459" stroke-width="1.5"/>
</svg>
<div style="padding:12px 16px 14px;display:flex;flex-direction:column;gap:6px;flex:1">
<div style="display:flex;justify-content:space-between;align-items:baseline"><div style="font-family:'Fraunces',serif;font-weight:800;font-size:24px">The Bicycle</div><div style="font-size:12px;font-weight:700;color:#B3452B;background:#FBE9E4;padding:3px 9px;border-radius:99px">Opens at Ratios 3</div></div>
<div style="font-size:14px;color:#6B6459">Gear ratios, wheel size, how far one pedal turn takes you.</div>
<div style="margin-top:auto;display:flex;gap:8px"><span style="font-size:13px;font-weight:600;color:#B3452B;text-decoration:underline">Test me on Ratios</span><span style="font-size:13px;color:#6B6459">or practice it</span></div>
</div>
</button>

<!-- catapult -->
<button style="text-align:left;border:1.5px solid #D9D4CB;border-radius:18px;background:#FBFAF7;padding:0;overflow:hidden;display:flex;flex-direction:column;color:#22201C">
<svg viewBox="0 0 440 150" width="100%" height="150" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display:block;flex:none;opacity:0.85">
<rect width="440" height="150" fill="#F7F3EC"/><path d="M0 125 H440 V150 H0Z" fill="#CFE7C4"/>
<g stroke="#7E4F22" stroke-width="5" stroke-linecap="round" fill="none"><path d="M90 125 L120 70 L150 125 M120 70 L250 20"/></g><rect x="236" y="14" width="18" height="14" fill="#4A4A4F"/><circle cx="104" cy="92" r="12" fill="#6E7278"/>
<path d="M250 20 Q330 0 400 60" fill="none" stroke="#B3452B" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="400" cy="62" r="6" fill="#B3452B"/>
<rect x="380" y="90" width="30" height="35" fill="#C9C0B1" stroke="#5E564B"/>
</svg>
<div style="padding:12px 16px 14px;display:flex;flex-direction:column;gap:6px;flex:1">
<div style="display:flex;justify-content:space-between;align-items:baseline"><div style="font-family:'Fraunces',serif;font-weight:800;font-size:24px">The Catapult</div><div style="font-size:12px;font-weight:700;color:#B3452B;background:#FBE9E4;padding:3px 9px;border-radius:99px">Opens at Angles 1</div></div>
<div style="font-size:14px;color:#6B6459">Arm ratios, angles, how far it flies. Later trajectories.</div>
<div style="margin-top:auto;display:flex;gap:8px"><span style="font-size:13px;font-weight:600;color:#B3452B;text-decoration:underline">Test me on Angles</span><span style="font-size:13px;color:#6B6459">or practice it</span></div>
</div>
</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
