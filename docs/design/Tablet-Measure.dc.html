<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Math Builds: Tablet measure</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width:1180px;height:820px;box-sizing:border-box;background:#0E2740;color:#F2F6FA;font-family:'Figtree',sans-serif;display:flex;flex-direction:column;overflow:hidden">

<div style="height:72px;box-sizing:border-box;padding:0 24px;display:flex;align-items:center;justify-content:space-between;background:#0B2036;border-bottom:2px solid #24476B">
<div style="display:flex;align-items:center;gap:14px">
<button style="min-height:52px;padding:0 18px;border-radius:14px;border:2px solid #24476B;background:#12304D;color:#F2F6FA;font-weight:700;font-size:18px">Map</button>
<div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:28px">Cans and Planks</div>
</div>
<div style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z" fill="#FFD23F"/></svg><span style="font-family:'JetBrains Mono',monospace">12</span></div>
</div>

<div style="padding:22px 28px 0">
<div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:38px;letter-spacing:-0.5px">Count the blocks. How wide is the gap?</div>
</div>

<div style="margin:16px 28px 0;height:340px;border-radius:22px;overflow:hidden;background:#CFE6F7;position:relative">
<svg width="1124" height="340" viewBox="0 0 1124 340" style="display:block" role="img" aria-label="A gap between two cliffs with 7 numbered blocks across it, a truck on the left and a flag on the right">
<circle cx="1020" cy="60" r="34" fill="#FFD23F"/>
<path d="M0 150 H280 V340 H0Z" fill="#5A4B40"/><path d="M844 150 H1124 V340 H844Z" fill="#5A4B40"/>
<rect x="0" y="150" width="280" height="14" fill="#7FB04A"/><rect x="844" y="150" width="280" height="14" fill="#7FB04A"/>
<path d="M280 300 Q 340 288 400 300 T 520 300 T 640 300 T 760 300 T 844 300 V340 H280Z" fill="#1C5C8C"/>
<!-- 7 numbered blocks, 80 px each, from x=284 -->
<g font-family="JetBrains Mono" font-size="26" font-weight="700" fill="#0B2036" text-anchor="middle">
<g stroke="#0B2036" stroke-width="3" fill="#FFD23F" fill-opacity="0.35">
<rect x="282" y="190" width="80" height="80" rx="6" stroke-dasharray="8 6"/><rect x="362" y="190" width="80" height="80" rx="6" stroke-dasharray="8 6"/><rect x="442" y="190" width="80" height="80" rx="6" stroke-dasharray="8 6"/><rect x="522" y="190" width="80" height="80" rx="6" stroke-dasharray="8 6"/><rect x="602" y="190" width="80" height="80" rx="6" stroke-dasharray="8 6"/><rect x="682" y="190" width="80" height="80" rx="6" stroke-dasharray="8 6"/><rect x="762" y="190" width="80" height="80" rx="6" stroke-dasharray="8 6"/>
</g>
<text x="322" y="240">1</text><text x="402" y="240">2</text><text x="482" y="240">3</text><text x="562" y="240">4</text><text x="642" y="240">5</text><text x="722" y="240">6</text><text x="802" y="240">7</text></g>
<!-- truck -->
<g transform="translate(80 96)"><rect x="0" y="10" width="86" height="40" rx="6" fill="#FF7A1A"/><rect x="86" y="24" width="36" height="26" rx="6" fill="#E5650A"/><rect x="94" y="29" width="18" height="12" fill="#CFE6F7"/><circle cx="24" cy="54" r="13" fill="#0B2036"/><circle cx="100" cy="54" r="13" fill="#0B2036"/><text x="43" y="38" font-family="JetBrains Mono" font-size="16" font-weight="700" fill="#0B2036" text-anchor="middle">3 kg</text></g>
<!-- flag -->
<path d="M960 150 V70" stroke="#0B2036" stroke-width="5"/><path d="M960 70 H1004 L992 86 L1004 102 H960Z" fill="#B6E34A"/>
</svg>
<div style="position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#0B2036;border-radius:14px;padding:10px 20px;font-size:20px;font-weight:700">Tap each block as you count.</div>
</div>

<div style="display:flex;gap:20px;margin:18px 28px 0;flex:1;min-height:0">
<div style="flex:1;background:#0B2036;border:2px solid #24476B;border-radius:20px;padding:18px 22px">
<div style="font-size:15px;font-weight:700;color:#FFB070;font-family:'JetBrains Mono',monospace;letter-spacing:1px">ANSWER</div>
<div style="font-size:24px;font-weight:700;margin-top:6px">The gap is</div>
<div style="display:flex;align-items:center;gap:12px;margin-top:10px">
<button aria-label="Minus one" style="width:64px;height:64px;border-radius:16px;border:2px solid #5B7E9F;background:#12304D;color:#F2F6FA;font-size:36px;font-weight:700">-</button>
<div style="width:110px;height:64px;border-radius:16px;background:#F7F3E8;color:#0B2036;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:40px">7</div>
<button aria-label="Plus one" style="width:64px;height:64px;border-radius:16px;border:2px solid #5B7E9F;background:#12304D;color:#F2F6FA;font-size:36px;font-weight:700">+</button>
<div style="font-size:24px;font-weight:700">blocks wide</div>
</div>
</div>
<div style="width:470px;background:#0B2036;border:2px solid #24476B;border-radius:20px;padding:18px 22px;display:flex;flex-direction:column;gap:12px">
<div style="font-size:15px;font-weight:700;color:#FFB070;font-family:'JetBrains Mono',monospace;letter-spacing:1px">YOUR PLANKS</div>
<div style="display:flex;gap:10px;align-items:flex-end">
<div style="text-align:center"><div style="width:48px;height:36px;border-radius:6px;background:#E8B36B;border:2px solid #0B2036"></div><div style="font-size:15px;margin-top:4px">1 block</div></div>
<div style="text-align:center"><div style="width:96px;height:36px;border-radius:6px;background:#E8B36B;border:2px solid #0B2036"></div><div style="font-size:15px;margin-top:4px">2 blocks</div></div>
<div style="text-align:center"><div style="width:144px;height:36px;border-radius:6px;background:#E8B36B;border:2px solid #0B2036"></div><div style="font-size:15px;margin-top:4px">3 blocks</div></div>
</div>
<div style="font-size:16px;color:#9DB6CE">Earn more planks by getting the answer right.</div>
<button style="margin-top:auto;min-height:60px;border-radius:16px;border:0;background:#FF7A1A;color:#0B2036;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px">Check my answer</button>
</div>
</div>
<div style="height:20px"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
